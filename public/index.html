<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Chat</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Welcome Screen -->
    <div id="welcome-screen" class="screen active">
      <div class="welcome-container">
        <h1>Invite Chat</h1>
        <p>Chat with friends - no login required!</p>

        <div class="welcome-actions">
          <div class="action-card">
            <h3>Create a Room</h3>
            <input type="text" id="create-nickname" placeholder="Your nickname" maxlength="20">
            <input type="text" id="room-name" placeholder="Room name" maxlength="30">
            <select id="room-type">
              <option value="group">Group Chat</option>
              <option value="direct">Direct Message</option>
            </select>
            <button id="create-room-btn" class="btn primary">Create Room</button>
          </div>

          <div class="divider">or</div>

          <div class="action-card">
            <h3>Join with Code</h3>
            <input type="text" id="join-nickname" placeholder="Your nickname" maxlength="20">
            <input type="text" id="invite-code" placeholder="Enter invite code" maxlength="6">
            <button id="join-room-btn" class="btn secondary">Join Room</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="screen">
      <div class="chat-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <h2>Your Rooms</h2>
            <button id="new-room-btn" class="btn small">+ New</button>
          </div>
          <ul id="room-list" class="room-list"></ul>
          <div class="user-info">
            <span id="current-user"></span>
          </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
          <div id="no-room-selected" class="no-room">
            <p>Select a room or create a new one to start chatting</p>
          </div>

          <div id="chat-area" class="chat-area hidden">
            <header class="chat-header">
              <div class="room-info">
                <h3 id="current-room-name">Room Name</h3>
                <span id="current-room-members" class="member-count"></span>
              </div>
              <div class="room-actions">
                <button id="show-invite-btn" class="btn small">Invite</button>
                <button id="leave-room-btn" class="btn small danger">Leave</button>
              </div>
            </header>

            <div id="messages" class="messages"></div>

            <form id="message-form" class="message-form">
              <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
              <button type="submit" class="btn primary">Send</button>
            </form>
          </div>
        </main>
      </div>
    </div>

    <!-- Invite Modal -->
    <div id="invite-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Invite Friends</h3>
        <p>Share this code with your friends:</p>
        <div class="invite-code-display">
          <span id="modal-invite-code"></span>
          <button id="copy-code-btn" class="btn small">Copy</button>
        </div>
        <button id="close-modal-btn" class="btn">Close</button>
      </div>
    </div>

    <!-- New Room Modal -->
    <div id="new-room-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Create or Join Room</h3>
        <div class="modal-tabs">
          <button class="tab active" data-tab="create">Create</button>
          <button class="tab" data-tab="join">Join</button>
        </div>
        <div id="create-tab" class="tab-content active">
          <input type="text" id="modal-room-name" placeholder="Room name" maxlength="30">
          <select id="modal-room-type">
            <option value="group">Group Chat</option>
            <option value="direct">Direct Message</option>
          </select>
          <button id="modal-create-btn" class="btn primary">Create</button>
        </div>
        <div id="join-tab" class="tab-content">
          <input type="text" id="modal-invite-input" placeholder="Enter invite code" maxlength="6">
          <button id="modal-join-btn" class="btn secondary">Join</button>
        </div>
        <button id="close-new-room-modal" class="btn">Cancel</button>
      </div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
