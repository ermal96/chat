version: '3.8'

services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4545:4545"
    environment:
      - NODE_ENV=production
      - PORT=4545
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4545/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
